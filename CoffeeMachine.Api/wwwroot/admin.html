<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Brew Bliss Coffee</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/">Brew Bliss <span>Coffee</span></a>
    <nav><a href="/">Customer Website</a></nav>
</header>
<main class="admin-main">
    <section class="section">
        <p class="eyebrow">MANAGEMENT</p>
        <h1>Admin Panel</h1>
        <p>Manage the drinks shown on the customer menu.</p>
    </section>

    <section class="panel admin-form-panel">
        <h2>Add or Update Drink</h2>
        <form id="drink-form">
            <input type="hidden" id="drink-id">
            <div class="form-grid">
                <div class="form-group"><label for="drink-name">Drink Name *</label><input id="drink-name" required maxlength="100"></div>
                <div class="form-group"><label for="drink-price">Price (₹) *</label><input id="drink-price" type="number" min="0.01" step="0.01" required></div>
                <div class="form-group form-wide"><label for="drink-description">Description</label><textarea id="drink-description" maxlength="500" rows="3"></textarea></div>
                <label class="check-label"><input id="drink-available" type="checkbox" checked> Available for customers</label>
            </div>
            <div class="button-row">
                <button class="primary-button" id="save-btn" type="submit">Save Drink</button>
                <button class="secondary-button" type="reset" onclick="clearDrinkForm()">Clear</button>
            </div>
        </form>
    </section>

    <section class="section">
        <div class="section-heading"><h2>Menu Management</h2><button class="secondary-button" type="button" onclick="loadDrinks()">Refresh Menu</button></div>
        <div id="admin-drink-list" class="admin-list">Loading drinks...</div>
    </section>

    <section class="section">
        <div class="section-heading"><div><p class="eyebrow">SAVED IN SQL SERVER</p><h2>Order History</h2></div><button class="secondary-button" type="button" onclick="loadOrderHistory()">Refresh Orders</button></div>
        <div id="order-history-list" class="admin-list">Press Refresh Orders to load orders.</div>
        <div id="order-details" class="panel order-detail-panel"></div>
    </section>
</main>
<footer><p>© <span id="year"></span> Brew Bliss Coffee · Admin</p></footer>
<script src="/js/app.js"></script>
</body>
</html>
